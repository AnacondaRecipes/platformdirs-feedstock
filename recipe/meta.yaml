{% set name = "platformdirs" %}
{% set version = "4.13.0" %}
{% set deselected_tests = "" %}
{% set deselected_tests = 'deselected_tests + " --deselect=tests/test_pytest_plugin.py::test_import_before_pytest_main[worker-thread]"' %}  # [osx]
{% set deselected_tests = 'deselected_tests + " --deselect=tests/test_api.py::test_no_ctypes --deselect=tests/test_windows.py::test_get_win_folder_from_registry_real"' %}  # [win and arm64]

# This test fails on macOS due to a ResourceWarning raised inside pytest when pytest.main() runs in a worker thread.
# On win-arm64 the HKCU Explorer\Shell Folders registry key is not populated in the build environment, so the
# ctypes-free fallback path (registry lookup) cannot resolve any folder and these tests fail with WinError 2.
package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 1aa0b0d3f224c1f07c295121e312a5a24a180d6ae5a8425ea1784b3e3863e9c0

build:
  number: 0
  skip: true  # [py<311]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - pip
    - python
    - hatch-vcs >=0.5
    - hatchling >=1.29
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - platformdirs
  requires:
    - pip
    - pytest >=9.0.2
    - pytest-mock >=3.15.1
    - appdirs >=1.4.4
  commands:
    - pip check
    - pytest tests -vv {{ deselected_tests }}

about:
  home: https://github.com/platformdirs/platformdirs
  license: MIT
  license_family: MIT
  license_file: LICENSE
  description: |
    About A small Python module for determining appropriate
    platform-specific dirs, e.g. a "user data dir".
  summary: A small Python module for determining appropriate platform-specific dirs, e.g. a "user data dir".
  dev_url: https://github.com/platformdirs/platformdirs
  doc_url: https://platformdirs.readthedocs.io

extra:
  recipe-maintainers:
    - adament
    - gaborbernat
